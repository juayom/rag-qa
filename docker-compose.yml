version: "3.9"

services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: rag-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

    volumes:
      - .:/app

  frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend

    container_name: rag-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped

    volumes:
      - ./frontend:/app
      - /app/node_modules