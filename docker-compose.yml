version: "3.9"

services:

  qdrant:

    image: qdrant/qdrant:latest

    container_name: rag-qdrant

    ports:
      - "6333:6333"

    restart: unless-stopped

    volumes:
      - qdrant_storage:/qdrant/storage

  backend:

    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: rag-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      QDRANT_URL: http://qdrant:6333

    depends_on:
      - qdrant

    restart: unless-stopped

    volumes:
      - .:/app

  frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend

    container_name: rag-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped

    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  qdrant_storage:
